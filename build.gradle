def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
def gradlewCommand = isWindows
		? ["cmd", "/c", file("gradlew.bat").absolutePath]
		: [file("gradlew").absolutePath]

tasks.register("buildFlyable", Exec) {
	group = "build"
	description = "Build the flyable Fabric mod."
	workingDir = file("mods/flyable")
	commandLine gradlewCommand + ["--no-daemon", "build"]
}

tasks.register("buildPerseverance", Exec) {
	group = "build"
	description = "Build the perseverance Fabric mod."
	workingDir = file("mods/perseverance")
	commandLine gradlewCommand + ["--no-daemon", "build"]
}

tasks.register("cleanFlyable", Exec) {
	group = "build"
	description = "Clean the flyable Fabric mod."
	workingDir = file("mods/flyable")
	commandLine gradlewCommand + ["--no-daemon", "clean"]
}

tasks.register("cleanPerseverance", Exec) {
	group = "build"
	description = "Clean the perseverance Fabric mod."
	workingDir = file("mods/perseverance")
	commandLine gradlewCommand + ["--no-daemon", "clean"]
}

tasks.register("build") {
	group = "build"
	description = "Build all Fabric mods."
	dependsOn("buildFlyable", "buildPerseverance")
}

tasks.register("clean") {
	group = "build"
	description = "Clean all Fabric mods."
	dependsOn("cleanFlyable", "cleanPerseverance")
}
